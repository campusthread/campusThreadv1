<!DOCTYPE html>
<html>

<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f8fafc;">
  <table width="100%" cellpadding="0" cellspacing="0"
    style="max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden;">
    <tr>
      <td style="padding: 24px; background: #1d4ed8; color: white; text-align: center;">
        <h1 style="margin: 0; font-size: 28px;">{{headline}}</h1>
      </td>
    </tr>
    <tr>
      <td style="padding: 24px; color: #0f172a;">
        <p style="margin: 0 0 16px;">Hello {{name}},</p>
        <p style="margin: 0 0 16px;">{{message}}</p>
        {{#if imageUrl}}
        <p style="margin: 0 0 20px;"><img src="{{imageUrl}}" alt="Reminder image"
            style="width: 100%; max-width: 560px; height: auto; border-radius: 12px;" /></p>
        {{/if}}
        <p style="margin: 0 0 24px;">Upload your newest products now to stay visible to students browsing for campus
          essentials.</p>
        <a href="{{ctaUrl}}"
          style="display: inline-block; background: #2563eb; color: white; text-decoration: none; padding: 14px 24px; border-radius: 10px; font-weight: bold;">{{ctaText}}</a>
      </td>
    </tr>
    <tr>
      <td style="padding: 24px; background: #f3f4f6; color: #475569; font-size: 14px; text-align: center;">
        <p style="margin: 0;">{{brandName}} is part of {{appName}}.</p>
        <p style="margin: 8px 0 0;"><a href="{{appUrl}}" style="color: #1d4ed8; text-decoration: none;">Visit
            {{appName}}</a></p>
      </td>
    </tr>
  </table>
</body>

</html>
