<!DOCTYPE html>
<html>

<body style="font-family: Arial, sans-serif; background: #f6f6f6; margin: 0; padding: 0;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center" style="padding: 40px 0;">
        <table width="600" cellpadding="0" cellspacing="0" role="presentation"
          style="background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);">
          <tr>
            <td style="padding: 36px; text-align: center;">
              <h1 style="margin: 0; font-size: 24px; color: #5b21b6;">Reset your password</h1>
              <p style="margin: 16px 0 24px; color: #334155; font-size: 16px; line-height: 1.6;">Hi {{name}},</p>
              <p style="margin: 0 0 24px; color: #475569; font-size: 16px; line-height: 1.6;">We received a request to
                reset your CampusThread password. Click the button below to choose a new password.</p>
              <a href="{{resetUrl}}"
                style="display: inline-block; padding: 14px 28px; background: #7c3aed; color: #ffffff; border-radius: 10px; text-decoration: none; font-weight: bold;">Reset
                password</a>
              <p style="margin: 24px 0 0; color: #64748b; font-size: 14px; line-height: 1.6;">If you didn't request a
                password reset, you can safely ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
